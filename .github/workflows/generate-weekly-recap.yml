name: Generate Weekly Recap

on:
  schedule:
    # 毎週月曜日 朝6時（JST）に実行
    # 日曜 21:00 UTC = 月曜 6:00 JST
    - cron: '0 21 * * 0'
  workflow_dispatch:
    # 手動実行も可能

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate Weekly Recap questions
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_weekly_recap.py
      
      - name: Upload generated JSON files as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-recap-json-${{ github.run_number }}
          path: data/weekly_recap/*.json
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Update questions.db with Weekly Recap
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          TARGET_DATE=$(python -c "from datetime import datetime, timedelta; today = datetime.now(); days_from_monday = today.weekday() % 7; monday = today - timedelta(days=days_from_monday); print(monday.strftime('%Y-%m-%d'))")
          for file in data/weekly_recap/${TARGET_DATE}_j1.json data/weekly_recap/${TARGET_DATE}_europe.json; do
            if [ -f "$file" ]; then
              python scripts/json_to_db.py "$file" --no-cleanup
            fi
          done
      
      - name: Commit and push changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/weekly_recap/*.json data/questions.db
          if git diff --staged --quiet; then
            echo "変更がありません。コミットをスキップします。"
          else
            TARGET_DATE=$(python -c "from datetime import datetime, timedelta; today = datetime.now(); days_from_monday = today.weekday() % 7; monday = today - timedelta(days=days_from_monday); print(monday.strftime('%Y-%m-%d'))")
            git commit -m "chore: Generate weekly recap questions for $TARGET_DATE"
            git push
          fi
